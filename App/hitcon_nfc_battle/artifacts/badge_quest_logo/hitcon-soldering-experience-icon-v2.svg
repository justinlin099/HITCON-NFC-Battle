  </g>

  <!-- PCB traces and through-hole pads beneath the active solder joint. -->
  <g fill="none" stroke="#00F5FF" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M465 365H405V430H370"/>
    <path d="M465 365V470H530"/>

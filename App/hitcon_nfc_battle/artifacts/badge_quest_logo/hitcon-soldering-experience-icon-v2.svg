  <!-- The fedora band and brim follow the original kit-board artwork. -->
  <path d="M421 105C484 126 557 130 646 118L676 132C579 160 482 164 384 136Z"
        fill="#FF17E9" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>

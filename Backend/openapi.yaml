openapi: 3.0.3
info:
  title: HITCON 2026 NFC Battle API
  version: 1.0.0
  description: |
    OpenAPI specification for the HITCON 2026 NFC Battle backend.

    `Backend/game-flow.md` is the source of truth for product behavior. This
    file mirrors that flow as a machine-readable API contract.

    User roles:
    - `ATTENDEE`
    - `STAFF`
    - `SPONSOR`
    - `COMMUNITY`

    Authenticated app APIs use the conference JWT:
    `Authorization: Bearer <JWT>`. The backend derives caller identity from the
    JWT subject, which is the user ID provided by the JWT issuer. JWT
    verification uses a shared secret and HMAC.

    Required JWT claims:
    - `sub`: user ID, provided by the JWT issuer.
    - `exp`: expiration time.
    - `iss`: issuer.
    - `aud`: audience.
    - `role`: caller role, used for fast role lookup without querying the DB.

    Physical NFC tag IDs are predictable, so scan requests must include both the
    parsed user ID from the tag URL and the physical ID read from the tag. The
    server must verify that the physical ID belongs to the parsed user ID before
    adding the target user to the scanner's collection.

    Collection records are the long-term permission for full profile access.
    `profile_version` and `collection_version` are integer versions stored on
    the user row. `profile_version` changes when profile fields change.
    `collection_version` changes only when that user's own collection changes.

    `GET /users/me` is the only endpoint that lazy-initializes a user profile.
    The app should call it before pairing tags, scanning, recording phishing
    events, uploading a print-card image, or using cache/bootstrap APIs that
    expect the authenticated user row to already exist.

    `nfc_tag_key` is a per-user random 6-byte key encoded as a 12-character
    lowercase hex string. It is returned only in self-profile responses
    (`GET /users/me` and the `me` object from `GET /users/me/bootstrap`). The
    mobile app should store it locally, not show it to the user, use it to lock
    the NFC tag after writing the tag URL, and use it to unlock the tag after
    the conference when the app exposes that action.

    Staff APIs under `/staff/*` require a conference JWT whose `role` claim is
    `STAFF`. Scoreboard status, freeze, and resume APIs additionally require
    `STAFF_DANGER_TOKEN`.
    Freeze calculates and stores a per-user score and prize snapshot using
    `scoring_cutoff_at` as the latest event timestamp that counts toward the
    snapshot. Prize lookups read that stored snapshot instead of recalculating
    results on every request. Resume invalidates the current freeze snapshot and
    reopens scoring.

    The external prize is not calculated by this game. Staff record it in
    `prize_claims` with `type: EXTERNAL` after applying the external criteria.
    The stamp prize uses `type: STAMP` and can be claimed during the event
    after reaching the live stamp threshold. The frozen ranking prize uses
    `type: RANKING` in the same claim log. The scoreboard exposes external redemptions as
    `external_prize`, without changing scores or ranks.

    Current provisional scoring formula, used for both live and frozen scores:
    `score = 10 * num_of_collection - 10 * num_of_phishing`. The phishing
    penalty is applied to the phishing victim. This formula may be finalized or
    changed in the future.

    A scoreboard can stay in `FREEZING` only until the configured
    `freeze_timeout`. After that, the freeze is stale and staff may recover it
    with `POST /staff/resume_scoreboard`.

    Scoreboard state behavior:

    The following endpoints are available in all states (`OPEN`, `FREEZING`,
    and `FROZEN`):
    - `GET /users/me`
    - `PATCH /users/me`
    - `GET /users/me/bootstrap`
    - `POST /users/batch`
    - `GET /users/{user_id}`
    - `GET /users/{user_id}/collection`, subject to collection-based visibility
      permission
    - `POST /tags/pair`
    - `POST /collection/scan`
    - `POST /collection/phishing`
    - `GET /missions/stamp`
    - `POST /print-cards`
    - `GET /staff/scoreboard_status`
    - `POST /staff/pair_user_tag`
    - `POST /staff/unpair_user_tag`
    - `GET /staff/print-cards/{short_token}`
    - `POST /staff/nfc-unlock-code`
    - `POST /staff/prize-claims` with `type: EXTERNAL`
    - `GET /staff/prize-claims/{user_id}?type=EXTERNAL`
    - `POST /staff/prize-claims` with `type: STAMP`
    - `GET /staff/prize-claims/{user_id}?type=STAMP`

    The following endpoints are available only in `FROZEN`:
    - `GET /users/me/prize`; rejected in `OPEN` and `FREEZING` with
      `SCOREBOARD_NOT_FROZEN`. If the scoreboard state changes during a
      consistent read, it is rejected with `SCOREBOARD_READ_INCONSISTENT` and
      clients should retry.
    - `POST /staff/prize-claims` with `type: RANKING`; rejected in `OPEN` and
      `FREEZING` with `SCOREBOARD_NOT_FROZEN`.

    The following endpoints are available in `OPEN` and `FROZEN`, but rejected
    in `FREEZING`:
    - `GET /scoreboard`; returns live scores in `OPEN`, returns the stored
      freeze snapshot in `FROZEN`, and is rejected in `FREEZING` with
      `SCOREBOARD_FREEZING` error.
    - `GET /scoreboard/me`; returns the authenticated user's live rank and
      score breakdown in `OPEN`, returns their rank and score breakdown from
      the stored freeze snapshot in `FROZEN`, and is rejected in `FREEZING`
      with `SCOREBOARD_FREEZING` error.

    If the scoreboard state changes during a consistent read by either
    endpoint, it is rejected with `SCOREBOARD_READ_INCONSISTENT` and clients
    should retry.

    The following endpoints are state transition operations:
    - `POST /staff/freeze_scoreboard`: accepted only in `OPEN`; rejected in
      `FREEZING` or `FROZEN` with `409 Conflict`
    - `POST /staff/resume_scoreboard`: accepted in `FROZEN` and stale
      `FREEZING`; rejected in `OPEN` and non-stale `FREEZING` with
      `SCOREBOARD_NOT_FROZEN`

    The app remains usable after the conference ends. Pairing, scanning,
    phishing records, profile updates, collection browsing, bootstrap, and
    batch refresh continue to update live app data after the scoreboard is
    frozen. The freeze operation creates a score and prize snapshot; later live
    activity must not change that stored snapshot unless staff explicitly
    resumes scoring and freezes again.
servers:
  - url: https://nfc-battle-api.hitcon2026.online
    description: Production API
  - url: https://nfc-battle-staging.hitcon2026.online
    description: Staging API
  - url: http://localhost:8787
    description: Local development API
security:
  - bearerAuth: []
tags:
  - name: Users
  - name: Tags
  - name: Collection
  - name: Missions
  - name: Scoreboard
  - name: Staff
  - name: Print cards
paths:
  /users/me:
    get:
      tags: [Users]
      summary: Lazy initialize or get my profile
      description: |
        Creates a default profile when the authenticated JWT subject is new,
        then returns the authenticated user's complete data. `physical_id` is
        the first paired NFC card, or `null` before the user pairs a card.
      responses:
        '200':
          description: Profile loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyProfileResponse'
              examples:
                profile:
                  $ref: '#/components/examples/GetMyProfileResponse'
                unpaired:
                  $ref: '#/components/examples/GetMyUnpairedProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Users]
      summary: Update my profile
      description: |
        Partially updates the authenticated user's profile. The user may send
        only the fields they want to change. Updatable fields are
        `display_name`, `emoji_icon`, `bio`, and `pixel_avatar_base64`. If the
        submitted fields are identical to the stored profile, the server returns
        the current profile without incrementing `profile_version`.

        Text fields are truncated without error at UTF-8 character boundaries:
        `display_name` to 100 bytes, `emoji_icon` to 64 bytes, and `bio` to
        4096 bytes. A non-empty avatar must be a base64-encoded PNG whose
        decoded size does not exceed 64 KiB. Image dimensions are not checked.
        The complete JSON request body must not exceed 128 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
            examples:
              update:
                $ref: '#/components/examples/UpdateMyProfileRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyProfileResponse'
              examples:
                profile:
                  $ref: '#/components/examples/GetMyProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
  /users/me/prize:
    get:
      tags: [Users]
      summary: Get my prize result
      description: |
        Returns the authenticated user's prize result after the scoreboard is
        frozen and prize calculation has run. Prize results are read from the
        stored freeze snapshot. This endpoint is rejected while the scoreboard
        is `OPEN` or `FREEZING`. If the scoreboard state changes during a
        consistent read, the endpoint returns `SCOREBOARD_READ_INCONSISTENT`
        and clients should retry.
      responses:
        '200':
          description: Prize result loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyPrizeResponse'
              examples:
                prize:
                  $ref: '#/components/examples/GetMyPrizeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Scoreboard is not frozen yet, or the read saw a transient scoreboard state change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_frozen:
                  $ref: '#/components/examples/ScoreboardNotFrozenError'
                read_inconsistent:
                  $ref: '#/components/examples/ScoreboardReadInconsistentError'
  /users/me/bootstrap:
    get:
      tags: [Users]
      summary: Bootstrap my local app cache
      description: |
        Returns the authenticated user's full profile plus full profiles for all
        users they have collected. This endpoint is intended for app recovery or
        fresh installs, not normal incremental refresh. Collected user profiles
        do not include nested collection lists. The authenticated user must
        already be initialized with `GET /users/me`.
      responses:
        '200':
          description: Bootstrap data loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyBootstrapResponse'
              examples:
                bootstrap:
                  $ref: '#/components/examples/GetMyBootstrapResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /users/batch:
    post:
      tags: [Users]
      summary: Batch refresh user profiles
      description: |
        Read-only, idempotent batch lookup for multiple cached user profiles.
        This endpoint uses `POST` only so the client can send a structured
        request body with many user IDs and cached versions.

        For each user, the server applies the same visibility rule as
        `GET /users/{user_id}`: full profile if the caller has collected that
        user, otherwise partial profile. If the client sends both cached
        versions and both match the server's current versions, the server
        returns only `user_id` and `unchanged: true` for that user.

        `profile_version` is the client's cached version of that user's profile
        fields. `collection_version` is the client's cached version of that
        user's collection list. When either cached version is omitted or stale,
        the server returns `unchanged: false` plus the user's profile using the
        same visibility behavior as `GET /users/{user_id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetUsersRequest'
            examples:
              batch:
                $ref: '#/components/examples/BatchGetUsersRequest'
      responses:
        '200':
          description: Batch profile data loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetUsersResponse'
              examples:
                batch:
                  $ref: '#/components/examples/BatchGetUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /users/{user_id}:
    get:
      tags: [Users]
      summary: Get another user's profile
      description: |
        Returns another user's profile. If the caller has collected the queried
        user, the server returns full profile data plus version metadata.
        Otherwise, it only returns `user_id`, `display_name`, and `emoji_icon`,
        allowing the mobile app to show a locked character state.

        The client may send both `profile_version` and `collection_version` for
        a cached full profile. If both versions match the server's current
        versions, the server returns an unchanged marker instead of the profile
        body. If either version is omitted or stale, the server returns the
        profile body using the normal visibility rule.
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
          description: Target user ID from the JWT issuer.
          example: kktix_hash_abc123
        - in: query
          name: profile_version
          required: false
          schema:
            type: integer
            minimum: 0
          description: Locally cached profile version for this user.
          example: 2
        - in: query
          name: collection_version
          required: false
          schema:
            type: integer
            minimum: 0
          description: Locally cached collection version for this user.
          example: 5
      responses:
        '200':
          description: Profile loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserProfileResponse'
              examples:
                partial:
                  $ref: '#/components/examples/GetPartialUserProfileResponse'
                full:
                  $ref: '#/components/examples/GetFullUserProfileResponse'
                unchanged:
                  $ref: '#/components/examples/GetUnchangedUserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /users/{user_id}/collection:
    get:
      tags: [Users]
      summary: Get another user's collection
      description: |
        Returns the queried user's collection only when the caller has collected
        the queried user. For each user in that collection, the server applies
        the same visibility rule from the caller's point of view: full profile
        if the caller has collected that listed user, otherwise partial profile.

        The client may send `collection_version` for a cached collection. If it
        matches the server's current collection version for the queried user,
        the server returns an unchanged marker instead of the collection body.
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
          description: Target user ID from the JWT issuer.
          example: kktix_hash_def456
        - in: query
          name: collection_version
          required: false
          schema:
            type: integer
            minimum: 0
          description: Locally cached collection version for this user.
          example: 5
      responses:
        '200':
          description: Collection loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserCollectionResponse'
              examples:
                collection:
                  $ref: '#/components/examples/GetUserCollectionResponse'
                unchanged:
                  $ref: '#/components/examples/GetUnchangedUserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /tags/pair:
    post:
      tags: [Tags]
      summary: Pair a physical NFC tag to my profile
      description: |
        Called at the reception desk after the user picks up a tag and scans it
        with the app. The user must already be initialized with `GET /users/me`
        before pairing. This self-service endpoint pairs only the user's first
        UID and returns `TAG_ALREADY_PAIRED` if either the user or physical ID
        already has a pairing. Staff may add more UIDs with
        `POST /staff/pair_user_tag`; every paired UID resolves to the same
        profile and shared NFC unlock code. The app also writes
        `https://game.hitcon2026.online/b?u={user_id}` to the tag, then locks
        the tag so it is read-only and cannot be accidentally overwritten.

        This endpoint remains available in `OPEN`, `FREEZING`, and `FROZEN` so
        the app keeps working after the conference ends. Pairing after a freeze
        updates live app data but does not change the stored score and prize
        snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairTagRequest'
            examples:
              pair:
                $ref: '#/components/examples/PairTagRequest'
      responses:
        '200':
          description: Tag paired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                paired:
                  value:
                    status: success
                    message: Tag paired successfully.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
        '409':
          $ref: '#/components/responses/TagAlreadyPairedError'
  /collection/scan:
    post:
      tags: [Collection]
      summary: Scan another NFC tag
      description: |
        Called after the app opens from a scanned tag URL, reads the tag's
        physical ID, and extracts `user_id` from the URL.

        The server verifies that `physical_id` belongs to `user_id`, adds the
        target user ID to the scanner's collection, increments the scanner's
        `collection_version` if this is a new collection record, and returns the
        scanned user's profile without that user's collection list.

        This endpoint remains available in `OPEN`, `FREEZING`, and `FROZEN` so
        the app keeps working after the conference ends. Scans after a freeze
        update live collection data but do not change the stored score and prize
        snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCollectionRequest'
            examples:
              scan:
                $ref: '#/components/examples/ScanCollectionRequest'
      responses:
        '200':
          description: Scan accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanCollectionResponse'
              examples:
                scan:
                  $ref: '#/components/examples/ScanCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PhysicalIdMismatchError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /collection/phishing:
    post:
      tags: [Collection]
      summary: Record a clicked-link phishing event
      description: |
        Called when the app is opened by clicking a URL instead of scanning a
        physical NFC tag, so the app cannot detect a physical ID. The server
        records `victim` and `attacker`.

        This endpoint remains available in `OPEN`, `FREEZING`, and `FROZEN` so
        the app keeps working after the conference ends. Phishing records after
        a freeze update live event data but do not change the stored score and
        prize snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhishingRequest'
            examples:
              phishing:
                $ref: '#/components/examples/PhishingRequest'
      responses:
        '200':
          description: Phishing event recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                recorded:
                  value:
                    status: success
                    message: Phishing event recorded.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /missions/stamp:
    get:
      tags: [Missions]
      summary: Get stamp mission progress
      description: |
        Returns `stamp_threshold` and the authenticated user's progress toward
        the sponsor plus community stamp prize.
      responses:
        '200':
          description: Stamp mission progress loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStampMissionResponse'
              examples:
                stamp:
                  $ref: '#/components/examples/GetStampMissionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /scoreboard:
    get:
      tags: [Scoreboard]
      summary: Get global scoreboard
      description: |
        Returns the global scoreboard using offset/limit pagination.

        In `OPEN`, this endpoint returns live scores using the current
        provisional formula: `score = 10 * num_of_collection - 10 *
        num_of_phishing`. The phishing penalty is applied to the victim.

        In `FREEZING`, this endpoint is rejected because a consistent snapshot
        is being calculated.

        In `FROZEN`, this endpoint returns the stored freeze snapshot, so scores
        do not change even if pairing, scanning, phishing records, and profile
        updates continue after the conference ends. The response includes the
        snapshot `freeze_id` and `scoring_cutoff_at`. Each ranking includes a
        live `external_prize` flag, which does not affect score, rank,
        or the freeze snapshot.

        If the scoreboard state changes during a consistent read, the endpoint
        returns `SCOREBOARD_READ_INCONSISTENT` and clients should retry.
      parameters:
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          example: 50
      responses:
        '200':
          description: Scoreboard loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScoreboardResponse'
              examples:
                scoreboard:
                  $ref: '#/components/examples/GetScoreboardResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Scoreboard is freezing, or the read saw a transient scoreboard state change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                freezing:
                  $ref: '#/components/examples/ScoreboardFreezingError'
                read_inconsistent:
                  $ref: '#/components/examples/ScoreboardReadInconsistentError'
  /scoreboard/me:
    get:
      tags: [Scoreboard]
      summary: Get my current rank
      description: |
        Returns the authenticated user's global rank, score, collection count,
        phishing count, and scoring constants. In `OPEN`, these values use live
        data; in `FROZEN`, they use the stored scoreboard snapshot. Score fields
        are null when the authenticated subject has no scoreboard entry. This
        endpoint is rejected while the scoreboard is `FREEZING` or if its state
        changes during the read.
      responses:
        '200':
          description: Current rank loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyScoreboardRankResponse'
              examples:
                rank:
                  $ref: '#/components/examples/GetMyScoreboardRankResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Scoreboard is freezing, or the read saw a transient scoreboard state change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                freezing:
                  $ref: '#/components/examples/ScoreboardFreezingError'
                read_inconsistent:
                  $ref: '#/components/examples/ScoreboardReadInconsistentError'
  /staff/scoreboard_status:
    get:
      tags: [Staff]
      summary: Get scoreboard freeze status
      description: |
        Staff-only status endpoint for inspecting the scoreboard state before
        freeze or resume operations. Requires a staff JWT plus
        `STAFF_DANGER_TOKEN`. Returns the current state, current `freeze_id`,
        freeze timestamps, `scoring_cutoff_at`, configured freeze timeout, and
        whether a `FREEZING` state is stale.
      security:
        - bearerAuth: []
          staffDangerToken: []
      responses:
        '200':
          description: Scoreboard status loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScoreboardStatusResponse'
              examples:
                status:
                  $ref: '#/components/examples/GetScoreboardStatusResponse'
        '401':
          description: Missing or invalid JWT, or missing or invalid `STAFF_DANGER_TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/UnauthorizedError'
                staff_danger_token:
                  $ref: '#/components/examples/StaffDangerTokenError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /staff/pair_user_tag:
    post:
      tags: [Staff]
      summary: Pair an additional NFC tag to a user
      description: |
        Staff-only endpoint used when a user's NFC tag is printed. Requires a
        conference JWT whose `role` claim is `STAFF`. This endpoint preserves
        existing UIDs and pairs `physical_id` to `user_id`. Staff or the app should write
        `https://game.hitcon2026.online/b?u={user_id}` to the new tag and lock
        it before giving it to the user.

        The `nfc_tags` table is the source of truth for all paired physical tag
        IDs. Each UID passes `POST /collection/scan` for that user. This
        operation does not change `profile_version` or `collection_version`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairUserTagRequest'
            examples:
              pair:
                $ref: '#/components/examples/PairUserTagRequest'
      responses:
        '200':
          description: User tag paired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                paired:
                  value:
                    status: success
                    message: User tag paired successfully.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
        '409':
          $ref: '#/components/responses/TagAlreadyPairedError'
  /staff/unpair_user_tag:
    post:
      tags: [Staff]
      summary: Unpair an NFC tag from a user
      description: |
        Staff-only endpoint used when a paired NFC tag is lost, broken, or
        replaced. Requires a conference JWT whose `role` claim is `STAFF`.
        Removes only the submitted `physical_id` mapping from `user_id`; the
        user's other paired tags remain valid.

        The operation is idempotent when the submitted physical ID is already
        unpaired. If the physical ID is currently paired to another user, the
        endpoint returns `PHYSICAL_ID_MISMATCH`. Unpairing does not change
        `profile_version`, `collection_version`, or `nfc_tag_key`. Once
        removed, that physical ID no longer passes `POST /collection/scan` for
        the user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnpairUserTagRequest'
            examples:
              unpair:
                $ref: '#/components/examples/UnpairUserTagRequest'
      responses:
        '200':
          description: User tag is unpaired or was already unpaired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                unpaired:
                  value:
                    status: success
                    message: User tag unpaired successfully.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PhysicalIdMismatchError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /staff/freeze_scoreboard:
    post:
      tags: [Staff]
      summary: Freeze scoreboard and calculate prizes
      description: |
        Freezes the scoreboard near the end of the conference. Requires a staff
        JWT plus `STAFF_DANGER_TOKEN`. The server should atomically transition
        the scoreboard from `OPEN` to `FREEZING`, calculate final scores and
        stored prize results for a new `freeze_id`, then transition to `FROZEN`.

        This endpoint is accepted only while the scoreboard is `OPEN`. A
        successful freeze creates a score and prize snapshot, but it does not
        disable live app features.

        The request may include `scoring_cutoff_at`, which is the latest event
        timestamp that should count in the score snapshot. If omitted, the
        server uses its current time. The value must not be later than the
        server time when the freeze begins. The server should include only
        collection records and phishing records whose event timestamps are less
        than or equal to `scoring_cutoff_at`.

        A scoreboard that remains in `FREEZING` longer than `freeze_timeout` is
        stale. Stale partial results for that `freeze_id` must not be visible to
        users.

        Current provisional scoring formula:
        `score = 10 * num_of_collection - 10 * num_of_phishing`. The phishing
        penalty is applied to the victim and is already reflected in live
        scores before this snapshot is created. This formula may be finalized
        or changed in the future.

        Prize results are snapshot data and should not be recalculated on every
        `GET /users/me/prize` request.
      security:
        - bearerAuth: []
          staffDangerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreezeScoreboardRequest'
            examples:
              freeze:
                $ref: '#/components/examples/FreezeScoreboardRequest'
      responses:
        '200':
          description: Scoreboard frozen and prizes calculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeScoreboardResponse'
              examples:
                frozen:
                  $ref: '#/components/examples/FreezeScoreboardResponse'
        '401':
          description: Missing or invalid JWT, or missing or invalid `STAFF_DANGER_TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/UnauthorizedError'
                staff_danger_token:
                  $ref: '#/components/examples/StaffDangerTokenError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ScoreboardAlreadyFrozenError'
  /staff/resume_scoreboard:
    post:
      tags: [Staff]
      summary: Resume an accidentally frozen scoreboard
      description: |
        Resumes the scoreboard after an accidental freeze. Requires a staff JWT
        plus `STAFF_DANGER_TOKEN`. The server should transition `FROZEN` back
        to `OPEN` and invalidate the stored result snapshot for the current
        `freeze_id`.

        This endpoint may also recover a stale `FREEZING` state by changing it
        back to `OPEN` and invalidating partial results for the stale
        `freeze_id`. It is rejected in `OPEN` and non-stale `FREEZING`.
      security:
        - bearerAuth: []
          staffDangerToken: []
      responses:
        '200':
          description: Scoreboard resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                resumed:
                  value:
                    status: success
                    message: Scoreboard resumed.
        '401':
          description: Missing or invalid JWT, or missing or invalid `STAFF_DANGER_TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/UnauthorizedError'
                staff_danger_token:
                  $ref: '#/components/examples/StaffDangerTokenError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ScoreboardNotFrozenError'
  /print-cards:
    post:
      tags: [Print cards]
      summary: Upload a PNG for staff to print
      description: |
        Stores one PNG image in protected object storage for the authenticated
        user and returns a compact, opaque `short_token`. The app renders that
        token as a barcode on the print card. The image is only downloadable by STAFF through
        `GET /staff/print-cards/{short_token}`. Each new upload replaces the
        authenticated user's previous request, deletes its old PNG object, and
        invalidates its old token. The user must already have been initialized
        through `GET /users/me`.

        The default 4 MiB image limit accommodates a standard 85.5 mm by 54 mm
        card rendered at up to 300 DPI, with reasonable room beyond its raw
        pixel data. Multipart framing may use up to 64 KiB beyond the configured
        image limit. Upload attempts are limited to two per user and thirty
        globally per minute.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              additionalProperties: false
              properties:
                image:
                  type: string
                  format: binary
                  description: PNG image. Its maximum size is configured by the Worker `PRINT_CARD_MAX_UPLOAD_BYTES` environment variable and defaults to 4 MiB.
      responses:
        '200':
          description: Image stored and barcode token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePrintCardResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /staff/print-cards/{short_token}:
    get:
      tags: [Staff, Print cards]
      summary: Download a print-card PNG after scanning its barcode
      description: Requires a STAFF JWT. The response body is the original PNG bytes.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: short_token
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{8,32}$'
          description: Opaque token decoded from the attendee barcode.
      responses:
        '200':
          description: PNG image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Print-card token was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /staff/prize-claims:
    post:
      tags: [Staff]
      summary: Claim an external, stamp, or ranking prize for an attendee
      description: |
        Requires a STAFF JWT. The submitted NFC UID must belong to `user_id`.
        `type: EXTERNAL` records a prize awarded under criteria outside this
        game, does not require the scoreboard to be frozen, and is limited to
        one claim per attendee. `type: STAMP` is available during the event
        after the attendee reaches the live sponsor-plus-community stamp
        threshold, and is limited to one claim per attendee. `type: RANKING`
        requires a frozen scoreboard and its stored ranking-prize result, and
        is limited to one claim per attendee and freeze snapshot.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPrizeRequest'
      responses:
        '200':
          description: Prize claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPrizeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PhysicalIdMismatchError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
        '409':
          description: Scoreboard is not frozen, user is ineligible, or this prize was already claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /staff/prize-claims/{user_id}:
    get:
      tags: [Staff]
      summary: Check an attendee's prize claim
      description: |
        Requires a STAFF JWT. `type: EXTERNAL` checks the externally-awarded
        prize without requiring a scoreboard freeze. `type: STAMP` checks the
        event-wide live stamp claim. `type: RANKING` checks the current frozen
        scoreboard snapshot and is rejected if it is not frozen.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
          example: kktix_hash_abc123
        - in: query
          name: type
          required: true
          schema:
            $ref: '#/components/schemas/PrizeClaimType'
          example: EXTERNAL
      responses:
        '200':
          description: Prize claim status loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPrizeClaimStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'
        '409':
          $ref: '#/components/responses/ScoreboardNotFrozenError'
  /staff/nfc-unlock-code:
    post:
      tags: [Staff]
      summary: Get a user's NFC unlock code
      description: |
        Requires a STAFF JWT. The server uses `user_id` to retrieve the user's
        shared unlock code. The submitted `uid` identifies the physical tag in
        the current support workflow and is echoed in the response, but it is
        not required to match an existing `nfc_tags` row because the physical
        tag's UID may have changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetNfcUnlockCodeRequest'
      responses:
        '200':
          description: NFC unlock code loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNfcUnlockCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Conference JWT sent as `Authorization: Bearer <JWT>`. Verified with a shared secret and HMAC. Required claims: `sub`, `exp`, `iss`, `aud`, and `role`.'
    staffDangerToken:
      type: apiKey
      in: header
      name: STAFF_DANGER_TOKEN
      description: Staff danger token for freeze/resume operations.

  responses:
    BadRequestError:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: BAD_REQUEST
            message: Invalid request body or query parameter.
    UnauthorizedError:
      description: Missing or invalid HMAC-signed JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: UNAUTHORIZED
            message: Missing or invalid JWT.
    StaffDangerTokenError:
      description: Missing or invalid `STAFF_DANGER_TOKEN`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: STAFF_DANGER_TOKEN_INVALID
            message: Missing or invalid staff danger token.
    UserNotFoundError:
      description: User not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: USER_NOT_FOUND
            message: User not found.
    ForbiddenError:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: FORBIDDEN
            message: Forbidden.
    PhysicalIdMismatchError:
      description: Physical tag ID does not belong to the parsed user ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: PHYSICAL_ID_MISMATCH
            message: Physical tag ID does not match user ID.
    TagAlreadyPairedError:
      description: NFC tag is already paired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: TAG_ALREADY_PAIRED
            message: This NFC tag is already paired.
    ScoreboardAlreadyFrozenError:
      description: Scoreboard is already frozen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: SCOREBOARD_ALREADY_FROZEN
            message: Scoreboard is already frozen.
    ScoreboardFreezingError:
      description: Scoreboard snapshot is being calculated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: SCOREBOARD_FREEZING
            message: Scoreboard is being frozen.
    ScoreboardNotFrozenError:
      description: Scoreboard is not frozen yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: SCOREBOARD_NOT_FROZEN
            message: Scoreboard is not frozen yet.
    ScoreboardReadInconsistentError:
      description: Scoreboard state changed during a consistent read; clients should retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: SCOREBOARD_READ_INCONSISTENT
            message: Scoreboard state changed while reading. Please retry.
    PayloadTooLargeError:
      description: Request body exceeds the endpoint's size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: PAYLOAD_TOO_LARGE
            message: Request body exceeds the endpoint's size limit.
    RateLimitError:
      description: Too many requests were made within the configured rate-limit window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: RATE_LIMITED
            message: Too many print-card upload requests.

  schemas:
    ErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
          enum: [error]
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - STAFF_DANGER_TOKEN_INVALID
            - FORBIDDEN
            - USER_NOT_FOUND
            - PHYSICAL_ID_MISMATCH
            - TAG_ALREADY_PAIRED
            - SCOREBOARD_ALREADY_FROZEN
            - SCOREBOARD_FREEZING
            - SCOREBOARD_NOT_FROZEN
            - SCOREBOARD_READ_INCONSISTENT
            - PRINT_CARD_NOT_FOUND
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - PRIZE_NOT_ELIGIBLE
            - PRIZE_ALREADY_CLAIMED
        message:
          type: string

    SuccessResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string

    UserRole:
      type: string
      enum: [ATTENDEE, STAFF, SPONSOR, COMMUNITY]

    PhysicalTagId:
      type: string
      minLength: 20
      maxLength: 20
      pattern: '^(?:[0-9A-Fa-f]{2}:){6}[0-9A-Fa-f]{2}$'
      description: Seven-byte physical NFC tag UID represented as colon-separated hexadecimal bytes. Inputs are normalized to uppercase.
      example: '04:1A:2B:3C:4D:5E:6F'

    UserProfilePublicFull:
      type: object
      required:
        - user_id
        - display_name
        - role
        - emoji_icon
        - bio
        - pixel_avatar_base64
        - profile_version
        - collection_version
      properties:
        user_id:
          type: string
          description: User ID provided by the JWT issuer.
          example: kktix_hash_abc123
        display_name:
          type: string
          description: Stored display name, limited to 100 UTF-8 bytes.
          example: Hacker_Aries
        role:
          $ref: '#/components/schemas/UserRole'
        emoji_icon:
          type: string
          description: Icon text shown for the user, limited to 64 UTF-8 bytes.
          example: 🐱
        bio:
          type: string
          description: User bio, limited to 4096 UTF-8 bytes. May be empty.
          example: I love reverse engineering.
        pixel_avatar_base64:
          type: string
          description: Base64-encoded PNG avatar, or an empty string. Non-empty decoded images are limited to 64 KiB; dimensions are not validated.
          example: iVBORw0KGgoAAAANSU...
        profile_version:
          type: integer
          description: Incremented when profile fields change.
          example: 3
        collection_version:
          type: integer
          description: Incremented when this user's own collection changes.
          example: 8

    UserProfileSelf:
      allOf:
        - $ref: '#/components/schemas/UserProfilePublicFull'
        - type: object
          required:
            - physical_id
            - nfc_tag_key
            - collection
          properties:
            physical_id:
              type: string
              nullable: true
              minLength: 20
              maxLength: 20
              pattern: '^(?:[0-9A-F]{2}:){6}[0-9A-F]{2}$'
              description: First paired NFC card physical ID, ordered by pairing time and then UID. This is null before the user pairs an NFC card.
              example: '04:1A:2B:3C:4D:5E:6F'
            nfc_tag_key:
              type: string
              pattern: '^[0-9a-f]{12}$'
              description: Per-user 6-byte NFC tag lock/unlock key encoded as a 12-character lowercase hex string. Returned only to the authenticated user.
              example: a1b2c3d4e5f6
            collection:
              type: array
              description: User IDs this user has previously scanned.
              items:
                type: string
              example: [kktix_hash_def456]

    UserProfilePartial:
      type: object
      required: [user_id, display_name, emoji_icon]
      properties:
        user_id:
          type: string
          example: kktix_hash_def456
        display_name:
          type: string
          example: Alice
        emoji_icon:
          type: string
          description: Emoji character shown as the user's icon.
          example: 😉

    UserCollectionItem:
      oneOf:
        - $ref: '#/components/schemas/UserProfilePublicFull'
        - $ref: '#/components/schemas/UserProfilePartial'

    UserCollection:
      type: object
      required: [user_id, collection_version, users]
      properties:
        user_id:
          type: string
          description: Owner of this collection.
          example: kktix_hash_def456
        collection_version:
          type: integer
          example: 8
        users:
          type: array
          description: Hydrated users in the collection.
          items:
            $ref: '#/components/schemas/UserCollectionItem'

    GetMyProfileResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/UserProfileSelf'

    GetMyBootstrapResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [me, collected_users]
          properties:
            me:
              $ref: '#/components/schemas/UserProfileSelf'
            collected_users:
              type: array
              description: Full profiles for users the authenticated user has collected.
              items:
                $ref: '#/components/schemas/UserProfilePublicFull'

    UpdateMyProfileRequest:
      type: object
      description: |
        Partial profile update. Only `display_name`, `emoji_icon`, `bio`, and
        `pixel_avatar_base64` are updatable. Overlong text is silently
        truncated at a UTF-8 character boundary.
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: Must not be all whitespace. Values over 100 UTF-8 bytes are silently truncated.
          example: Aries_The_Great
        emoji_icon:
          type: string
          description: Must not be all whitespace. Values over 64 UTF-8 bytes are silently truncated.
          example: 🚀
        bio:
          type: string
          description: May be empty. Values over 4096 UTF-8 bytes are silently truncated.
          example: Updated bio.
        pixel_avatar_base64:
          type: string
          description: Empty string or a base64-encoded PNG no larger than 64 KiB after decoding. Image dimensions are not validated.
          example: iVBORw0KGgo...

    GetUserProfileResponse:
      oneOf:
        - $ref: '#/components/schemas/GetUnchangedUserResponse'
        - $ref: '#/components/schemas/GetPartialUserProfileResponse'
        - $ref: '#/components/schemas/GetFullUserProfileResponse'

    CachedUserUnchanged:
      type: object
      required: [user_id, unchanged]
      properties:
        user_id:
          type: string
          example: kktix_hash_def456
        unchanged:
          type: boolean
          enum: [true]

    GetUnchangedUserResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/CachedUserUnchanged'

    GetPartialUserProfileResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/UserProfilePartial'

    GetFullUserProfileResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/UserProfilePublicFull'

    GetUserCollectionResponse:
      oneOf:
        - $ref: '#/components/schemas/GetUserCollectionLoadedResponse'
        - $ref: '#/components/schemas/GetUnchangedUserResponse'

    GetUserCollectionLoadedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/UserCollection'

    BatchGetUsersRequest:
      type: object
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [user_id]
            additionalProperties: false
            properties:
              user_id:
                type: string
                example: kktix_hash_def456
              profile_version:
                type: integer
                minimum: 0
                description: |
                  Locally cached profile version for this user, if any. If this
                  is omitted, the server treats the profile cache as stale.
                example: 2
              collection_version:
                type: integer
                minimum: 0
                description: |
                  Locally cached collection version for this user's collection
                  list, if any. If the caller has full access to this user and
                  this is omitted, the server treats the collection cache as
                  stale.
                example: 7

    BatchUserResult:
      oneOf:
        - $ref: '#/components/schemas/CachedUserUnchanged'
        - type: object
          required: [user_id, unchanged, data]
          properties:
            user_id:
              type: string
              example: kktix_hash_def456
            unchanged:
              type: boolean
              enum: [false]
            data:
              description: Profile data using the same visibility behavior as `GET /users/{user_id}`.
              oneOf:
                - $ref: '#/components/schemas/UserProfilePublicFull'
                - $ref: '#/components/schemas/UserProfilePartial'

    BatchGetUsersResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/BatchUserResult'

    PairTagRequest:
      type: object
      required: [physical_id]
      additionalProperties: false
      properties:
        physical_id:
          $ref: '#/components/schemas/PhysicalTagId'

    PairUserTagRequest:
      type: object
      required: [user_id, physical_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: User ID that receives the additional paired NFC tag.
          example: kktix_hash_abc123
        physical_id:
          allOf:
            - $ref: '#/components/schemas/PhysicalTagId'
          description: Physical ID read from the additional NFC tag.

    UnpairUserTagRequest:
      type: object
      required: [user_id, physical_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: User ID whose NFC tag mapping should be removed.
          example: kktix_hash_abc123
        physical_id:
          allOf:
            - $ref: '#/components/schemas/PhysicalTagId'
          description: Physical ID of the NFC tag to unpair.

    CreatePrintCardResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [short_token]
          properties:
            short_token:
              type: string
              description: Opaque value to encode in the attendee barcode.
              example: wQ8Yp2-Lz9M

    ClaimPrizeRequest:
      type: object
      required: [user_id, uid, type]
      additionalProperties: false
      properties:
        user_id:
          type: string
          example: kktix_hash_abc123
        uid:
          allOf:
            - $ref: '#/components/schemas/PhysicalTagId'
          description: Physical NFC UID read from the attendee's tag.
        type:
          $ref: '#/components/schemas/PrizeClaimType'

    PrizeClaimType:
      type: string
      enum: [EXTERNAL, STAMP, RANKING]
      description: |
        `EXTERNAL` is awarded under criteria outside this game. `STAMP` is
        independently claimable during the event once the live stamp threshold
        is met. `RANKING` is calculated when the scoreboard freezes.

    ClaimPrizeResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [type, freeze_id, user_id, claimed_at]
          properties:
            type:
              $ref: '#/components/schemas/PrizeClaimType'
            freeze_id:
              type: string
              nullable: true
            user_id:
              type: string
            stamp_prize:
              type: boolean
            rank_prize:
              type: boolean
            rank:
              type: integer
              nullable: true
            claimed_at:
              type: string
              format: date-time
            claimed_by_user_id:
              type: string
              description: Staff user who recorded an `EXTERNAL` claim.

    GetPrizeClaimStatusResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [user_id, type, freeze_id, claimed, claimed_at, claimed_by_user_id]
          properties:
            user_id:
              type: string
            type:
              $ref: '#/components/schemas/PrizeClaimType'
            freeze_id:
              type: string
              nullable: true
            claimed:
              type: boolean
            claimed_at:
              type: string
              format: date-time
              nullable: true
            claimed_by_user_id:
              type: string
              nullable: true

    GetNfcUnlockCodeRequest:
      type: object
      required: [user_id, uid]
      additionalProperties: false
      properties:
        user_id:
          type: string
          example: kktix_hash_abc123
        uid:
          allOf:
            - $ref: '#/components/schemas/PhysicalTagId'
          description: Physical NFC UID observed during the support workflow. It is contextual and is not ownership-validated against `nfc_tags`.

    GetNfcUnlockCodeResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [user_id, uid, unlock_code]
          properties:
            user_id:
              type: string
            uid:
              allOf:
                - $ref: '#/components/schemas/PhysicalTagId'
              description: Echo of the contextual UID submitted in the request.
            unlock_code:
              type: string
              pattern: '^[0-9a-f]{12}$'
              description: Shared 6-byte lock/unlock code for all of the user's NFC tags.

    ScanCollectionRequest:
      type: object
      required: [user_id, physical_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: User ID parsed from the scanned tag URL.
          example: kktix_hash_def456
        physical_id:
          allOf:
            - $ref: '#/components/schemas/PhysicalTagId'
          description: Physical ID read from the scanned NFC tag.

    ScanCollectionResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [collected_user_id, first_time_collected, profile]
          properties:
            collected_user_id:
              type: string
              example: kktix_hash_def456
            first_time_collected:
              type: boolean
              description: Whether this scan inserted a new collection record.
              example: true
            profile:
              $ref: '#/components/schemas/UserProfilePublicFull'

    PhishingRequest:
      type: object
      required: [victim, attacker]
      additionalProperties: false
      properties:
        victim:
          type: string
          description: User ID of the authenticated app user who clicked the link.
          example: kktix_hash_victim
        attacker:
          type: string
          description: User ID parsed from the clicked phishing URL.
          example: kktix_hash_attacker

    GetStampMissionResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required:
            - stamp_threshold
            - sponsor_count
            - community_count
            - eligible_for_stamp_prize
          properties:
            stamp_threshold:
              type: integer
              description: Configurable threshold for sponsor plus community stamps.
              example: 20
            sponsor_count:
              type: integer
              example: 12
            community_count:
              type: integer
              example: 8
            eligible_for_stamp_prize:
              type: boolean
              example: true

    ScoreboardItem:
      type: object
      required: [rank, user_id, display_name, emoji_icon, score, external_prize]
      properties:
        rank:
          type: integer
          example: 1
        user_id:
          type: string
          example: kktix_hash_abc123
        display_name:
          type: string
          example: Root_User
        emoji_icon:
          type: string
          description: Emoji character shown as the user's icon.
          example: 💻
        score:
          type: integer
          example: 2500
        external_prize:
          type: boolean
          description: Whether staff has recorded an external-prize claim. This does not affect score or rank.
          example: false

    GetScoreboardResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required:
            - offset
            - limit
            - rank_threshold
            - frozen
            - freeze_id
            - scoring_cutoff_at
            - rankings
          properties:
            offset:
              type: integer
              example: 0
            limit:
              type: integer
              example: 50
            rank_threshold:
              type: integer
              description: Configurable top-rank threshold for rank prizes.
              example: 10
            frozen:
              type: boolean
              example: false
            freeze_id:
              type: string
              nullable: true
              description: Current freeze snapshot ID when frozen, otherwise null.
              example: freeze_20260412_01
            scoring_cutoff_at:
              type: string
              format: date-time
              nullable: true
              description: Latest event timestamp included in the frozen score snapshot, or null for live scores.
              example: '2026-04-12T15:00:00Z'
            rankings:
              type: array
              items:
                $ref: '#/components/schemas/ScoreboardItem'

    GetMyScoreboardRankResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required:
            - rank
            - score
            - num_of_collection
            - num_of_phishing
            - score_per_collection
            - phishing_penalty
            - frozen
            - freeze_id
            - scoring_cutoff_at
          properties:
            rank:
              type: integer
              nullable: true
              description: Authenticated user's global rank, or null if the user has no scoreboard entry.
              example: 7
            score:
              type: integer
              nullable: true
              description: Calculated live or frozen score, or null if the user has no scoreboard entry.
              example: 230
            num_of_collection:
              type: integer
              minimum: 0
              nullable: true
              description: Collection count used to calculate the returned score.
              example: 25
            num_of_phishing:
              type: integer
              minimum: 0
              nullable: true
              description: Phishing count used to calculate the returned score.
              example: 2
            score_per_collection:
              type: integer
              minimum: 0
              description: Score awarded for each collected user.
              example: 10
            phishing_penalty:
              type: integer
              minimum: 0
              description: Score deducted for each phishing event affecting the user.
              example: 10
            frozen:
              type: boolean
              example: false
            freeze_id:
              type: string
              nullable: true
              description: Current freeze snapshot ID when frozen, otherwise null.
              example: freeze_20260412_01
            scoring_cutoff_at:
              type: string
              format: date-time
              nullable: true
              description: Latest event timestamp included in the frozen score snapshot, or null for live scores.
              example: '2026-04-12T15:00:00Z'

    GetMyPrizeResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [scoreboard_frozen, stamp_prize, rank_prize]
          properties:
            scoreboard_frozen:
              type: boolean
              enum: [true]
            stamp_prize:
              type: boolean
              description: Whether the user won the stamp prize.
              example: true
            rank_prize:
              type: boolean
              description: Whether the user won the rank prize.
              example: true
            rank:
              type: integer
              nullable: true
              example: 7

    ScoreboardFreezeState:
      type: string
      enum: [OPEN, FREEZING, FROZEN]

    GetScoreboardStatusResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required:
            - state
            - freeze_id
            - freeze_started_at
            - frozen_at
            - scoring_cutoff_at
            - freeze_timeout_seconds
            - freezing_stale
          properties:
            state:
              $ref: '#/components/schemas/ScoreboardFreezeState'
            freeze_id:
              type: string
              nullable: true
              description: Current freeze snapshot ID, or null when scoring is open.
              example: freeze_20260412_01
            freeze_started_at:
              type: string
              format: date-time
              nullable: true
              description: Time the current freeze calculation started.
              example: '2026-04-12T15:00:00Z'
            frozen_at:
              type: string
              format: date-time
              nullable: true
              description: Time the scoreboard reached FROZEN state.
              example: '2026-04-12T15:01:12Z'
            scoring_cutoff_at:
              type: string
              format: date-time
              nullable: true
              description: Latest event timestamp included in the current freeze snapshot, or null when no freeze snapshot exists.
              example: '2026-04-12T15:00:00Z'
            freeze_timeout_seconds:
              type: integer
              description: Configured timeout before FREEZING is considered stale.
              example: 30
            freezing_stale:
              type: boolean
              description: Whether the current FREEZING state has exceeded the timeout.
              example: false

    FreezeScoreboardRequest:
      type: object
      additionalProperties: false
      properties:
        scoring_cutoff_at:
          type: string
          format: date-time
          description: |
            Latest event timestamp included in the score and prize snapshot. If
            omitted, the server uses its current time. Must not be later than
            the server time when the freeze begins.
          example: '2026-04-12T15:00:00Z'

    FreezeScoreboardResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required:
            - frozen
            - freeze_id
            - scoring_cutoff_at
            - frozen_at
            - stamp_threshold
            - rank_threshold
          properties:
            frozen:
              type: boolean
              enum: [true]
            freeze_id:
              type: string
              description: Stored score and prize snapshot ID.
              example: freeze_20260412_01
            scoring_cutoff_at:
              type: string
              format: date-time
              description: Latest event timestamp included in the score and prize snapshot.
              example: '2026-04-12T15:00:00Z'
            frozen_at:
              type: string
              format: date-time
              description: Time the scoreboard reached FROZEN state.
              example: '2026-04-12T15:01:12Z'
            stamp_threshold:
              type: integer
              example: 20
            rank_threshold:
              type: integer
              example: 10


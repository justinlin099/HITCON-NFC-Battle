name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare Worker environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy Worker backend (${{ inputs.environment }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/nfc-battle-api-server

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/nfc-battle-api-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Apply remote D1 migrations
        run: npm run db:migrate:${{ inputs.environment }}

      - name: Sync staging Worker secrets
        if: inputs.environment == 'staging'
        env:
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          STAFF_DANGER_TOKEN: ${{ secrets.STAGING_STAFF_DANGER_TOKEN }}
        run: |
          test -n "$JWT_SECRET" || { echo "STAGING_JWT_SECRET is not configured"; exit 1; }
          test -n "$STAFF_DANGER_TOKEN" || { echo "STAGING_STAFF_DANGER_TOKEN is not configured"; exit 1; }
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --env staging
          printf '%s' "$STAFF_DANGER_TOKEN" | npx wrangler secret put STAFF_DANGER_TOKEN --env staging

      - name: Sync production Worker secrets
        if: inputs.environment == 'production'
        env:
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          STAFF_DANGER_TOKEN: ${{ secrets.PRODUCTION_STAFF_DANGER_TOKEN }}
        run: |
          test -n "$JWT_SECRET" || { echo "PRODUCTION_JWT_SECRET is not configured"; exit 1; }
          test -n "$STAFF_DANGER_TOKEN" || { echo "PRODUCTION_STAFF_DANGER_TOKEN is not configured"; exit 1; }
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --env production
          printf '%s' "$STAFF_DANGER_TOKEN" | npx wrangler secret put STAFF_DANGER_TOKEN --env production

      - name: Deploy Worker
        run: npm run deploy:${{ inputs.environment }}
